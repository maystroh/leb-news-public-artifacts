<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Beirut Briefing</title>
<style>
  @font-face {
    font-family: "Dubai";
    src: url("./../../../fonts/Dubai-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Dubai";
    src: url("./../../../fonts/Dubai-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Dubai";
    src: url("./../../../fonts/Dubai-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #050d14;
    --bg-deep: #02080d;
    --panel: rgba(7, 19, 30, 0.88);
    --panel-strong: rgba(4, 13, 21, 0.96);
    --line: rgba(120, 172, 205, 0.14);
    --text: #f4efe5;
    --muted: #9ab2c5;
    --accent: #cd7f32;
    --accent-soft: rgba(205, 127, 50, 0.25);
    --cyan: #67bfd8;
    --cyan-soft: rgba(103, 191, 216, 0.16);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    --font-arabic: "Dubai", "Noto Naskh Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 20% 18%, rgba(205, 127, 50, 0.16), transparent 20%),
      radial-gradient(circle at 78% 12%, rgba(60, 152, 196, 0.18), transparent 25%),
      linear-gradient(180deg, #06131d, #03080d 72%);
    color: var(--text);
    overflow: hidden;
    font-family: var(--font-arabic);
    font-weight: 400;
  }

  #stage {
    position: relative;
    width: min(100vw, 405px);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background:
      radial-gradient(circle at 22% 18%, rgba(205, 127, 50, 0.12), transparent 18%),
      radial-gradient(circle at 78% 20%, rgba(86, 170, 212, 0.12), transparent 24%),
      linear-gradient(180deg, var(--bg-deep), var(--bg));
    border: 1px solid rgba(205, 127, 50, 0.18);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }

  #audio-gate {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 44%, rgba(205, 127, 50, 0.2), transparent 28%),
      rgba(2, 8, 13, 0.42);
    transition: opacity 260ms ease;
  }

  #audio-gate.is-hidden {
    opacity: 0;
    pointer-events: none;
  }

  #audio-gate-button {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    border: 1px solid rgba(205, 127, 50, 0.78);
    background: rgba(5, 13, 20, 0.84);
    color: var(--text);
    cursor: pointer;
    font-family: var(--font-arabic);
    font-size: 21px;
    font-weight: 700;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.38), inset 0 0 26px rgba(205, 127, 50, 0.18);
  }

  #audio-gate-button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 5px;
  }

  #grid {
    position: absolute;
    inset: -18%;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    transform: rotate(-8deg) scale(1.08);
    opacity: 0.7;
    animation: driftGrid 22s linear infinite;
  }

  #ambient {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.28)),
      radial-gradient(circle at 50% 120%, rgba(205, 127, 50, 0.15), transparent 30%);
    pointer-events: none;
  }

  #bg-photo {
    position: absolute;
    inset: 0;
    background: url('./../../../logos/video-front-page-3.png') center/cover no-repeat;
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.2s ease, transform 6s ease;
  }

  #vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, transparent 28%, rgba(0, 0, 0, 0.6) 100%);
    pointer-events: none;
  }

  #scan-line {
    position: absolute;
    inset: 0 auto 0 -70%;
    width: 64%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(205, 127, 50, 0.06) 36%,
      rgba(205, 127, 50, 0.26) 50%,
      rgba(205, 127, 50, 0.06) 64%,
      transparent 100%
    );
    transform: skewX(-15deg);
    opacity: 0;
    pointer-events: none;
    animation: scanSweepLoop var(--scan-sweep-duration, 3200ms) linear infinite;
  }

  #scene-date-box {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    border: 1px solid rgba(205, 127, 50, 0.24);
    background: rgba(0, 0, 0, 0.42);
    color: rgba(212, 222, 232, 0.9);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: var(--font-arabic);
    font-size: 12px;
    letter-spacing: 0.14em;
    font-weight: 500;
    direction: ltr;
    backdrop-filter: blur(8px);
    z-index: 8;
    width: min(260px, calc(100% - 72px));
    text-align: center;
  }

  .ring {
    position: absolute;
    top: 70px;
    left: 50%;
    width: 250px;
    height: 250px;
    margin-left: -125px;
    border-radius: 50%;
    border: 2px solid rgba(205, 127, 50, 0.55);
    opacity: 0;
    transform: scale(0.86);
    pointer-events: none;
  }

  .ring.is-live {
    animation: ringPulse 2.4s ease-out infinite;
  }

  #radar-canvas {
    position: absolute;
    top: 70px;
    left: 50%;
    width: 250px;
    height: 250px;
    margin-left: -125px;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 3;
  }

  .bracket {
    position: absolute;
    width: 40px;
    height: 40px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .bracket::before,
  .bracket::after {
    content: "";
    position: absolute;
    background: rgba(205, 127, 50, 0.9);
    box-shadow: 0 0 8px rgba(205, 127, 50, 0.82);
  }

  .bracket::before {
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
  }

  .bracket::after {
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
  }

  .bracket.tl { top: 10px; left: 10px; }
  .bracket.tr { top: 10px; right: 10px; transform: scaleX(-1); }
  .bracket.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
  .bracket.br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

  #map-canvas {
    position: absolute;
    top: 398px;
    left: calc(50% + 62px);
    width: 175px;
    height: 120px;
    margin-left: -87.5px;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  #intro-copy {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 22px 30px;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    z-index: 6;
  }

  #intro-eyebrow {
    color: rgba(205, 127, 50, 0.92);
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 0;
  }

  #intro-title {
    font-size: 46px;
    line-height: 1.18;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #intro-date {
    color: rgba(205, 127, 50, 0.84);
    font-family: var(--font-arabic);
    font-size: 11px;
    letter-spacing: 0.16em;
    font-weight: 500;
  }

  #content {
    position: absolute;
    inset: 18px 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.45s ease;
    z-index: 7;
  }

  #content.is-visible {
    opacity: 1;
  }

  .panel {
    background: linear-gradient(180deg, rgba(10, 28, 42, 0.9), var(--panel-strong));
    border: 1px solid rgba(107, 162, 197, 0.16);
    border-radius: 26px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  #scene-card.is-visible,
  #outro-card.is-visible {
    animation: riseIn 0.65s cubic-bezier(.2,.8,.2,1) forwards;
  }

  #scene-card {
    flex: 1;
    min-height: 0;
    position: relative;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 6px;
    padding: 12px 18px 16px;
    margin-top: 30px;
    overflow: hidden;
    transform: translateY(18px);
    opacity: 0;
  }

  #scene-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 0;
  }

  #scene-meta {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  #outlet-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  #outlet-text-group {
    display: flex;
    align-items: center;
    min-height: 52px;
    min-width: 0;
  }

  #outlet-logo-box {
    width: 96px;
    height: 52px;
    border-radius: 14px;
    background: rgba(244, 247, 250, 0.97);
    border: 1px solid rgba(205, 127, 50, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
    flex-shrink: 0;
  }

  #outlet-logo {
    max-width: 76px;
    max-height: 34px;
    object-fit: contain;
  }

  #outlet-name {
    color: var(--accent);
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    line-height: 1.1;
    min-height: 52px;
    max-width: 100%;
  }

  #accent-bar {
    width: 62px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(81, 170, 223, 0.78), var(--accent), #ff9f54);
    animation: accentShift 3.4s ease-in-out infinite alternate;
    flex-shrink: 0;
  }

  #scene-summary {
    color: rgba(230, 236, 243, 0.92);
    font-size: 13px;
    line-height: 1.7;
    font-weight: 400;
    margin-top: 4px;
  }

  #scene-detail {
    position: relative;
    height: auto;
    min-height: 0;
    margin-top: 2px;
    border-radius: 22px;
    border: 1px solid rgba(205, 127, 50, 0.14);
    display: block;
    background:
      linear-gradient(180deg, rgba(8, 17, 27, 0.84), rgba(6, 12, 20, 0.92)),
      radial-gradient(circle at top, rgba(205, 127, 50, 0.08), transparent 52%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    overflow: hidden;
  }

  #scene-detail-image {
    position: absolute;
    top: 0;
    left: 50%;
    width: auto;
    height: auto;
    max-width: none;
    max-height: none;
    transform: translateX(-50%);
    transform-origin: center top;
    border-radius: 22px;
    display: block;
    padding: 0;
    background: transparent;
    opacity: 1;
    transition: opacity 320ms ease, filter 320ms ease;
    will-change: transform, opacity, filter;
  }

  #scene-detail-text {
    height: 100%;
    display: grid;
    align-content: center;
    gap: 12px;
    padding: 18px 18px 20px;
    color: rgba(235, 239, 244, 0.94);
    font-size: 14px;
    line-height: 1.95;
  }

  #outro-card {
    position: absolute;
    inset: 132px 22px 110px;
    display: grid;
    align-content: center;
    gap: 18px;
    padding: 28px 22px;
    text-align: center;
    opacity: 0;
    transform: translateY(18px);
    z-index: 7;
  }

  #outro-title {
    color: var(--accent);
    font-size: 16px;
    font-weight: 500;
  }

  #outro-body {
    font-size: 34px;
    line-height: 1.55;
    font-weight: 700;
  }

  .hidden {
    display: none !important;
  }

  @keyframes scanSweepLoop {
    0% {
      opacity: 0;
      transform: translateX(-140%) skewX(-15deg);
    }
    8% {
      opacity: 0.9;
      transform: translateX(-60%) skewX(-15deg);
    }
    45% {
      opacity: 1;
      transform: translateX(90%) skewX(-15deg);
    }
    68% {
      opacity: 0.18;
      transform: translateX(155%) skewX(-15deg);
    }
    100% {
      opacity: 0;
      transform: translateX(155%) skewX(-15deg);
    }
  }

  @keyframes ringPulse {
    0% { transform: scale(0.86); opacity: 0.72; }
    100% { transform: scale(1.52); opacity: 0; }
  }

  @keyframes driftGrid {
    from { transform: translateY(0) rotate(-8deg) scale(1.08); }
    to { transform: translateY(52px) rotate(-8deg) scale(1.08); }
  }

  @keyframes riseIn {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes accentShift {
    from { transform: translateX(0); }
    to { transform: translateX(14px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="audio-gate">
    <button id="audio-gate-button" type="button">تشغيل</button>
  </div>
  <div id="bg-photo"></div>
  <div id="grid"></div>
  <div id="ambient"></div>
  <div id="scan-line"></div>
  <div id="flash"></div>
  <div id="vignette"></div>

  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <canvas id="radar-canvas" width="250" height="250"></canvas>
  <canvas id="map-canvas" width="175" height="120"></canvas>

  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div id="intro-copy">
    <div id="intro-eyebrow"></div>
    <div id="intro-title"></div>
    <div id="intro-date"></div>
  </div>

  <div id="content">
    <div id="scene-date-box"></div>
    <section id="scene-card" class="panel">
      <div id="scene-top">
        <div id="outlet-wrap">
          <div id="outlet-logo-box">
            <img id="outlet-logo" alt="">
          </div>
          <div id="outlet-text-group">
            <div id="outlet-name"></div>
          </div>
        </div>
        <div id="scene-meta">
          <div id="accent-bar"></div>
        </div>
      </div>
      <div id="scene-summary"></div>
      <div id="scene-detail">
        <img id="scene-detail-image" alt="">
        <div id="scene-detail-text" class="hidden">
          <div id="scene-detail-body"></div>
        </div>
      </div>
    </section>

  </div>

  <section id="outro-card" class="panel hidden">
    <div id="outro-title"></div>
    <div id="outro-body"></div>
  </section>
</div>

  function resetSceneDetailImageStyles() {
    if (frontPagePanAnimation) {
      frontPagePanAnimation.cancel();
      frontPagePanAnimation = null;
    }
    sceneDetailImage.style.width = '';
    sceneDetailImage.style.height = '';
    sceneDetailImage.style.top = '0';
    sceneDetailImage.style.left = '50%';
    sceneDetailImage.style.transform = 'translateX(-50%)';
    sceneDetailImage.style.opacity = '1';
    sceneDetailImage.style.filter = 'none';
  }

  function fitFrontPageImage(outletKey, sceneDurationMs) {
    if (!sceneDetailImage.naturalWidth || !sceneDetailImage.naturalHeight) return;

    const fit = FRONT_PAGE_PAN_BY_OUTLET_KEY[outletKey] || { widthScale: 1, offsetY: 0 };
    const boxWidth = sceneDetail.clientWidth;
    const boxHeight = sceneDetail.clientHeight;
    const coverScale = Math.max(
      boxWidth / sceneDetailImage.naturalWidth,
      boxHeight / sceneDetailImage.naturalHeight
    );
    const appliedScale = coverScale * (fit.widthScale || 1);

    resetSceneDetailImageStyles();
    sceneDetailImage.style.width = `${Math.round(sceneDetailImage.naturalWidth * appliedScale)}px`;
    sceneDetailImage.style.height = `${Math.round(sceneDetailImage.naturalHeight * appliedScale)}px`;
    sceneDetailImage.style.top = `${fit.offsetY || 0}px`;

    requestAnimationFrame(() => {
      const imageHeight = sceneDetailImage.getBoundingClientRect().height;
      const overflow = Math.max(0, imageHeight - boxHeight - (fit.offsetY || 0));
      if (overflow <= 8) return;

      const oneWayDurationMs = Math.max(3500, Math.min(7000, Math.round(sceneDurationMs / 2.4)));
      frontPagePanAnimation = sceneDetailImage.animate(
        [
          { transform: 'translate(-50%, 0px)' },
          { transform: `translate(-50%, -${Math.round(overflow)}px)` }
        ],
        {
          duration: oneWayDurationMs,
          direction: 'alternate',
          iterations: Infinity,
          easing: 'ease-in-out'
        }
      );
    });
  }

  function fitContainedArticleImage() {
    if (!sceneDetailImage.naturalWidth || !sceneDetailImage.naturalHeight) return;

    const boxWidth = Math.max(1, sceneDetail.clientWidth - 18);

      boxWidth / sceneDetailImage.naturalWidth,
      boxHeight / sceneDetailImage.naturalHeight

    const appliedScale = containScale * 0.985;

    resetSceneDetailImageStyles();
    sceneDetailImage.style.width = `${Math.round(sceneDetailImage.naturalWidth * appliedScale)}px`;
    sceneDetailImage.style.height = `${Math.round(sceneDetailImage.naturalHeight * appliedScale)}px`;
    sceneDetailImage.style.top = '50%';
    sceneDetailImage.style.left = '50%';
    sceneDetailImage.style.transform = 'translate(-50%, -50%)';
  }

  function fitSceneDetailImage(fitMode, outletKey, sceneDurationMs) {
    if (fitMode === 'contain') {
      fitContainedArticleImage();
      return;
    }
    fitFrontPageImage(outletKey, sceneDurationMs);
  }

  function getSceneExcerpt(scene) {
    const source = scene.body || scene.visual?.summary || scene.title || '';
    const normalized = source.replace(/\s+/g, ' ').trim();
    if (!normalized) return 'يبقى هذا المشهد نصيا بانتظار مادة بصرية موازية.';

    const sentences = normalized
      .split(/(?<=[.؟!]|[.!?])\s+/)
      .filter(Boolean);
    const excerpt = sentences.slice(0, 2).join(' ').trim();

    if (excerpt.length <= 260) return excerpt;
    return `${excerpt.slice(0, 257).trim()}...`;
  }

  function normalizeOutletMediaPayload(mediaSources) {
    if (Array.isArray(mediaSources)) {
      return {
        fitMode: 'cover',
        items: mediaSources.filter(Boolean)
      };
    }

    if (mediaSources && typeof mediaSources === 'object') {
      return {
        fitMode: mediaSources.fitMode || 'cover',
        items: Array.isArray(mediaSources.items) ? mediaSources.items.filter(Boolean) : []
      };
    }

    return {
      fitMode: 'cover',
      items: mediaSources ? [mediaSources] : []
    };
  }

  function showSceneDetailMedia(scene, mediaSources, sceneDurationMs) {
    const mediaConfig = normalizeOutletMediaPayload(mediaSources);
    const mediaList = mediaConfig.items;

    if (!mediaList.length) {
      return false;
    }

    const mediaLabel = scene.outlet?.name || scene.title || scene.shortLabel || 'المشهد';
    const fitKey = scene.outlet?.key || scene.id || 'scene';

    const sequenceToken = ++mediaSequenceToken;
    const switchEveryMs = mediaList.length > 1
      ? Math.max(2800, Math.floor((sceneDurationMs - 400) / mediaList.length))
      : 0;

    clearMediaSequenceTimer();
    sceneDetailImage.classList.remove('hidden');
    sceneDetailText.classList.add('hidden');

    const renderFrame = (frameIndex, immediate = false) => {
      if (sequenceToken !== mediaSequenceToken) return;

      const source = mediaList[frameIndex];
      const applyFrame = () => {
        if (sequenceToken !== mediaSequenceToken) return;

        resetSceneDetailImageStyles();
        sceneDetailImage.onload = () => {
          if (sequenceToken !== mediaSequenceToken) return;
          fitSceneDetailImage(mediaConfig.fitMode, fitKey, sceneDurationMs);
        };
        sceneDetailImage.src = source;
        sceneDetailImage.alt = mediaList.length > 1
          ? `لقطة ${frameIndex + 1} - ${mediaLabel}`
          : `المادة البصرية - ${mediaLabel}`;

        if (sceneDetailImage.complete) {
          fitSceneDetailImage(mediaConfig.fitMode, fitKey, sceneDurationMs);
        }

        if (!immediate) {
          sceneDetailImage.animate(
            [
              { opacity: 0.18, filter: 'blur(10px)' },
              { opacity: 1, filter: 'blur(0px)' }
            ],
            {
              duration: 420,
              easing: 'ease-out',
              fill: 'forwards'
            }
          );
        }
      };

      if (immediate || !sceneDetailImage.getAttribute('src')) {
        applyFrame();
      } else {
        const fadeOut = sceneDetailImage.animate(
          [
            { opacity: 1, filter: 'blur(0px)' },
            { opacity: 0.18, filter: 'blur(10px)' }
          ],
          {
            duration: 260,
            easing: 'ease-in',
            fill: 'forwards'
          }
        );

        fadeOut.onfinish = () => {
          if (sequenceToken !== mediaSequenceToken) return;
          applyFrame();
        };
      }
    };

    const scheduleNextFrame = (frameIndex) => {
      if (mediaList.length <= 1 || switchEveryMs <= 0) return;
      clearMediaSequenceTimer();
      mediaSequenceTimer = setTimeout(() => {
        const nextFrameIndex = (frameIndex + 1) % mediaList.length;
        renderFrame(nextFrameIndex, false);
        scheduleNextFrame(nextFrameIndex);
      }, switchEveryMs);
    };

    renderFrame(0, true);
    scheduleNextFrame(0);
    return true;
  }

  function setScene(scene, index) {
    sceneSummary.textContent = scene.visual?.summary || scene.body;
    clearMediaSequenceTimer();
    playSceneAudio(scene);

    if (scene.outlet) {
      outletLogoBox.classList.remove('hidden');
      outletLogo.classList.remove('hidden');
      outletLogo.src = `./../../../public/outlet-logos/${scene.outlet.logoFile}`;
      outletLogo.alt = scene.outlet.name;
      outletName.textContent = scene.visual?.headline || scene.title;
    } else {
      outletLogoBox.classList.add('hidden');
      outletLogo.classList.add('hidden');
      outletName.textContent = scene.title || scene.shortLabel || 'المشهد الجامع';
    }

    const sceneDurationMs = getSceneDurationMs(scene, index);
    const sceneMedia = scene.media || null;
    const outletMedia = scene.outlet ? OUTLET_MEDIA_BY_OUTLET_KEY[scene.outlet.key] : null;
    if (showSceneDetailMedia(scene, sceneMedia || outletMedia, sceneDurationMs)) {
      return;
    } else {
      mediaSequenceToken += 1;
      sceneDetailImage.onload = null;
      resetSceneDetailImageStyles();
      sceneDetailImage.removeAttribute('src');
      sceneDetailImage.alt = '';
      sceneDetailImage.classList.add('hidden');
      sceneDetailBody.textContent = getSceneExcerpt(scene);
      sceneDetailText.classList.remove('hidden');
    }

  }

  function showIntro() {
    phaseType = 'intro';
    phaseStart = performance.now();
    phaseDuration = PLAYBACK_CONFIG.introMs;
    introStarted = true;
    playIntroAudio();

    flash.animate([{opacity: 0.42}, {opacity: 0}], {duration: 500, fill: 'forwards'});
    bgPhoto.style.opacity = '1';
    bgPhoto.style.transform = 'scale(1)';
    scanLine.style.opacity = '1';

    setTimeout(() => { radarCanvas.style.opacity = '1'; }, 900);
    setTimeout(() => { rings.forEach((ring, index) => { ring.style.opacity = '1'; ring.style.animationDelay = `${index * 0.7}s`; ring.classList.add('is-live'); }); }, 1200);
    setTimeout(() => { brackets.forEach((bracket, index) => setTimeout(() => { bracket.style.opacity = '1'; }, index * 90)); }, 1300);
    setTimeout(() => { mapCanvas.style.opacity = '1'; }, 1900);
    setTimeout(() => {
      introCopy.style.opacity = '1';
      introCopy.style.transform = 'translateY(0)';
    }, PLAYBACK_CONFIG.introTextRevealMs);
  }

  function hideIntro() {
    stopIntroAudio();
    introCopy.style.opacity = '0';
    introCopy.style.transform = 'translateY(18px)';
  }

  function showBriefing() {
    if (briefingStarted) return;
    briefingStarted = true;
    phaseType = 'scene';
    phaseStart = performance.now();

    content.classList.add('is-visible');
    sceneCard.classList.add('is-visible');
    activeSceneIndex = 0;
    phaseDuration = getSceneDurationMs(BRIEFING.scenes[0], 0);
    setScene(BRIEFING.scenes[0], 0);

    scanLine.style.opacity = '1';
    radarCanvas.style.opacity = '0.28';
    mapCanvas.style.opacity = '0.2';
    brackets.forEach((bracket) => { bracket.style.opacity = '0.32'; });
    rings.forEach((ring, index) => {
      ring.style.opacity = '0.22';
      ring.style.animationDelay = `${index * 0.7}s`;
      ring.classList.add('is-live');
    });
  }

  function showOutro() {
    if (outroStarted) return;
    outroStarted = true;
    phaseType = 'outro';
    phaseStart = performance.now();
    phaseDuration = PLAYBACK_CONFIG.outroMs;
    content.classList.remove('is-visible');
    stopSceneAudio();
    playOutroAudio();
    outroCard.classList.remove('hidden');
    outroCard.classList.add('is-visible');
  }

  function resetExperience() {
    activeSceneIndex = -1;
    phaseStart = 0;
    phaseDuration = PLAYBACK_CONFIG.introMs;
    phaseType = 'intro';
    introStarted = false;
    briefingStarted = false;
    outroStarted = false;
    ended = false;
    clearMediaSequenceTimer();
    stopIntroAudio();
    stopSceneAudio();
    stopOutroAudio();

    bgPhoto.style.opacity = '0';
    bgPhoto.style.transform = 'scale(1.08)';
    flash.style.opacity = '0';
    scanLine.style.opacity = '1';
    introCopy.style.opacity = '0';
    introCopy.style.transform = 'translateY(20px)';
    radarCanvas.style.opacity = '0';
    mapCanvas.style.opacity = '0';
    brackets.forEach((bracket) => { bracket.style.opacity = '0'; });
    rings.forEach((ring) => {
      ring.classList.remove('is-live');
      ring.style.opacity = '0';
      ring.style.animationDelay = '0s';
    });
    content.classList.remove('is-visible');
    outroCard.classList.add('hidden');
    outroCard.classList.remove('is-visible');
    sceneCard.classList.remove('is-visible');
    requestAnimationFrame(showIntro);
  }

  function drawRadar(now) {
    const ctx = radarCanvas.getContext('2d');
    const w = radarCanvas.width;
    const h = radarCanvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const r = 108;
    const sweep = ((now / 18) % 360) * Math.PI / 180;

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(103, 191, 216, 0.22)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i += 1) {
      ctx.beginPath();
      ctx.arc(cx, cy, (r / 4) * i, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - r, cy);
    ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx, cy + r);
    ctx.stroke();

    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    gradient.addColorStop(0, 'rgba(205, 127, 50, 0.22)');
    gradient.addColorStop(1, 'rgba(205, 127, 50, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, sweep - 0.34, sweep + 0.06);
    ctx.closePath();
    ctx.fill();

    requestAnimationFrame(drawRadar);
  }

  const mapCtx = mapCanvas.getContext('2d');

  function drawMap(ts) {
    mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
    mapPoints.forEach((point) => {
      const cycle = ((ts / 28) + point.offset) % 90;
      const progress = cycle / 90;
      const rippleScale = 0.4 + progress * 1.6;
      const rippleOpacity = Math.max(0, 0.7 - progress * 0.7);
      const labelOpacity = Math.max(0, 1 - progress * 1.4);
      const x = point.x * mapCanvas.width;
      const y = point.y * mapCanvas.height;

      mapCtx.beginPath();
      mapCtx.arc(x, y, 2.5, 0, Math.PI * 2);
      mapCtx.fillStyle = 'rgba(205,127,50,0.95)';
      mapCtx.shadowColor = 'rgba(255,180,60,0.88)';
      mapCtx.shadowBlur = 10;
      mapCtx.fill();
      mapCtx.shadowBlur = 0;

      mapCtx.beginPath();
      mapCtx.arc(x, y, 4 + rippleScale * 9, 0, Math.PI * 2);
      mapCtx.strokeStyle = `rgba(205,127,50,${rippleOpacity})`;
      mapCtx.lineWidth = 1.2;
      mapCtx.stroke();

      mapCtx.fillStyle = `rgba(180,220,255,${labelOpacity})`;
      mapCtx.font = '8px Segoe UI';
      mapCtx.fillText(point.label, x + 5, y - 4);
    });

    requestAnimationFrame(drawMap);
  }

  function tick(now) {
    const phaseElapsed = now - phaseStart;

    if (phaseType === 'intro') {
      if (phaseElapsed >= PLAYBACK_CONFIG.introMs) {
        hideIntro();
        showBriefing();
      }
    } else if (phaseType === 'scene') {
      const durationForCurrent = getSceneDurationMs(BRIEFING.scenes[activeSceneIndex], activeSceneIndex);
      phaseDuration = durationForCurrent;

      if (phaseElapsed >= durationForCurrent) {
        activeSceneIndex += 1;
        if (activeSceneIndex >= BRIEFING.scenes.length) {
          showOutro();
        } else {
          phaseStart = now;
          phaseDuration = getSceneDurationMs(BRIEFING.scenes[activeSceneIndex], activeSceneIndex);
          setScene(BRIEFING.scenes[activeSceneIndex], activeSceneIndex);
          sceneCard.classList.remove('is-visible');
          void sceneCard.offsetWidth;
          sceneCard.classList.add('is-visible');
        }
      }
    } else if (phaseType === 'outro') {
      if (phaseElapsed >= PLAYBACK_CONFIG.outroMs) ended = true;
    }

    if (!ended) requestAnimationFrame(tick);
  }

  requestAnimationFrame(drawRadar);
  requestAnimationFrame(drawMap);
  audioGateButton.addEventListener('click', () => {
    audioGate.classList.add('is-hidden');
    if (!introStarted) showIntro();
    requestAnimationFrame(tick);
  }, {once: true});
</script>
